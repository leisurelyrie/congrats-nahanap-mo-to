<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>one last goodbye</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #09090d;
      color: #e8e8ee;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, #ffffff55 1px, transparent 2px),
        radial-gradient(circle at 70% 20%, #ffffff44 1px, transparent 2px),
        radial-gradient(circle at 40% 80%, #ffffff33 1px, transparent 2px),
        radial-gradient(circle at 90% 70%, #ffffff44 1px, transparent 2px);
      background-size: 180px 180px;
      animation: drift 20s linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-180px); }
    }

    .card {
      position: relative;
      width: min(90%, 650px);
      max-height: 85vh;
      padding: 40px;
      background: #111118dd;
      border: 1px solid #ffffff15;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 80px #00000080;
      overflow-y: auto;
      z-index: 2;
    }

    .date {
      color: #777784;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 7vw, 55px);
      font-weight: normal;
      margin: 15px 0 25px;
    }

    #message {
      line-height: 1.9;
      color: #bdbdc8;
      white-space: pre-line;
      opacity: 0;
      transition: opacity 1.5s;
    }

    #message.show {
      opacity: 1;
    }

    button {
      margin-top: 25px;
      padding: 12px 22px;
      border: 1px solid #ffffff25;
      border-radius: 30px;
      background: transparent;
      color: #dddde5;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      background: #ffffff12;
      transform: translateY(-2px);
    }

    .signature {
      margin-top: 35px;
      color: #777784;
      font-style: italic;
      opacity: 0;
      transition: opacity 2s;
    }

    .signature.show {
      opacity: 1;
    }
  </style>
</head>

<body>

<div class="stars"></div>

<main class="card">
  <div class="date">one last thing</div>

  <h1>goodbye, Carvie.</h1>

  <div id="message"></div>

  <button id="reveal">read it</button>

  <div class="signature" id="signature">
    — someone who loved you
  </div>
</main>

<script>
const text = `I hope you're doing well.

Thank you for being honest with me. I know this probably wasn't easy for you to say, and I appreciate you taking the time to explain everything instead of leaving things unsaid.

I won't lie. Letting you go isn't something I can suddenly do just because you told me to.

You've meant so much to me for a really long time, and a part of me probably kept holding on because I was still hoping that somehow things would change.

But I understand now.

I don't want to keep waiting for something you already know you can't give me. I don't want my love for you to become something that keeps hurting both of us.

I'm sorry for holding on for this long.

You don't owe me another chance. You don't have to feel guilty for choosing what's best for yourself.

I think I'd still want that final conversation. Not because I'm trying to change your mind, but because after everything we've been through, I'd rather say goodbye properly than keep wondering about everything we never got to say.

I'll try to choose myself this time.

I can't promise I'll stop caring about you.

But I can promise I'll stop waiting for you.

Thank you for everything.

For the memories.
For the love.
Even for the things that hurt.

I don't regret loving you.

Maybe in another life things would've been different.

But in this one, I think I finally need to accept that sometimes loving someone means knowing when to let them go.`;

const message = document.getElementById("message");
const button = document.getElementById("reveal");
const signature = document.getElementById("signature");

button.addEventListener("click", () => {
  message.textContent = text;
  message.classList.add("show");
  signature.classList.add("show");

  button.textContent = "you can let go now";
  button.disabled = true;
});
</script>

</body>
</html>
